#cloud-config
# A coller dans le champ "Cloud config" lors de la creation d'un serveur Hetzner.
# Remplace CHANGE-MOI par le mot de passe que tu veux pour le panneau de gestion.
# Le serveur Minecraft + le panneau s'installent tout seuls (~5 min).
package_update: true
packages:
  - git
runcmd:
  - git clone -b claude/minecraft-bedrock-server-dv3s7l https://github.com/herizoe14-dev/Genius-.git /root/Genius-
  - PANEL_PASSWORD='CHANGE-MOI' bash /root/Genius-/minecraft-bedrock/install.sh > /var/log/bedrock-install.log 2>&1
