apply plugin: 'com.android.application'

android {
    namespace 'com.genius.echos'
    compileSdk 35

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
            assets.srcDirs = [rootProject.file('assets').path]
            jniLibs.srcDirs = ['libs']
        }
    }

    defaultConfig {
        applicationId 'com.genius.echos'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signée avec la clé debug pour pouvoir s'installer directement (sideload).
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources { excludes += ['META-INF/robovm/**'] }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-$abi"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-$abi"
    }
}

// Copie les bibliothèques natives libGDX dans android/libs/<abi>/
tasks.register('copyAndroidNatives') {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            ['armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86'].each { abi ->
                if (outputDir == null && jar.name.endsWith("natives-${abi}.jar")) outputDir = file("libs/${abi}")
            }
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}
tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach { it.dependsOn 'copyAndroidNatives' }
preBuild.dependsOn 'copyAndroidNatives'
